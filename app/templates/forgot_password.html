{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center py-4"><div class="col-lg-6"><div class="card p-4">
  <h1 class="h4 mb-2">Reset Password</h1><p class="text-muted">We will send Firebase's password-reset email to your registered address.</p>
  <form id="reset-form"><div class="mb-3"><label class="form-label">Role</label><select class="form-select" id="role" required><option value="student">Student</option><option value="teacher">Teacher</option></select></div><div class="mb-3"><label class="form-label">Student ID or Teacher ID</label><input class="form-control" id="identifier" required></div><div class="mb-3"><label class="form-label">Registered email address</label><input class="form-control" id="email" type="email" required></div><button class="btn btn-primary w-100" type="submit">Send Password Reset Email</button></form>
  <p id="status" class="small mt-3 mb-0" aria-live="polite"></p><p class="small mt-3 mb-0"><a href="{{ url_for('main.login') }}">Back to sign in</a>.</p>
</div></div></div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
const config={{ firebase_web_config|tojson }}; const status=document.querySelector('#status'); const show=(s,b=false)=>{status.textContent=s;status.className=`small mt-3 mb-0 ${b?'text-danger':'text-success'}`};
document.querySelector('#reset-form').addEventListener('submit',async(e)=>{e.preventDefault();try{if(!config.apiKey||!config.authDomain||!config.projectId||!config.appId)throw new Error('Firebase Web configuration is missing on the server.');const email=document.querySelector('#email').value.trim();const response=await fetch('{{ url_for("main.request_email_password_reset") }}',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({role:document.querySelector('#role').value,identifier:document.querySelector('#identifier').value.trim(),email})});const data=await response.json();if(!response.ok)throw new Error(data.error||'Unable to validate this account.');await sendPasswordResetEmail(getAuth(initializeApp(config)),data.email);show('Password reset email sent. Open it to choose a new password, then return to sign in.');}catch(error){show(error.message,true)}});
</script>
{% endblock %}
