{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center py-5"><div class="col-md-5"><div class="card p-4">
<h1 class="h4">Create a new password</h1><p class="text-muted">Your temporary password can only be used once.</p>
<form method="post">
<input class="form-control mb-3" type="password" name="current_password" placeholder="Current temporary password" required>
<input class="form-control mb-3" type="password" name="new_password" placeholder="New password" minlength="8" required>
<input class="form-control mb-3" type="password" name="confirm_password" placeholder="Confirm new password" minlength="8" required>
<button class="btn btn-primary w-100">Save password</button>
</form></div></div></div>
{% endblock %}
