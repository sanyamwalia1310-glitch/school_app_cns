{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="card p-4">
            <h1 class="h3 mb-3">Feedback</h1>
            <form method="post">
                <div class="row g-3">
                    <div class="col-md-6"><input class="form-control" name="name" placeholder="Your name" required></div>
                    <div class="col-md-6"><input class="form-control" type="email" name="email" placeholder="Email" required></div>
                    <div class="col-12">
                        <select class="form-select" name="category" required>
                            <option value="Suggestion">Suggestion</option>
                            <option value="Complaint">Complaint</option>
                            <option value="Appreciation">Appreciation</option>
                        </select>
                    </div>
                    <div class="col-12"><textarea class="form-control" name="message" rows="4" placeholder="Your feedback" required></textarea></div>
                </div>
                <button class="btn btn-primary mt-3">Send Feedback</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
