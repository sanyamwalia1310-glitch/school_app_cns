{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center py-4"><div class="col-lg-6"><div class="card p-4">
<h1 class="h4">Add / Verify Email</h1><p class="text-muted">Your existing school account continues to work. Add a real or parent/guardian email to enable verified Firebase email login.</p>
<form id="migration-form"><div class="mb-3"><label class="form-label">Real or parent/guardian email</label><input id="email" class="form-control" type="email" required autocomplete="email"></div><div class="mb-3"><label class="form-label">Current account password</label><input id="current-password" class="form-control" type="password" required autocomplete="current-password"></div><button id="start" class="btn btn-primary w-100">Send Verification Email</button></form>
<div id="continue-panel" class="d-none mt-3"><p class="mb-2">Verify the email, then continue.</p><button id="continue" class="btn btn-success">I've Verified / Continue</button></div><p id="status" class="small mt-3 mb-0" aria-live="polite"></p>
</div></div></div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, sendEmailVerification } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
const config={{ firebase_web_config|tojson }}, status=document.querySelector('#status'), auth=getAuth(initializeApp(config)); let token='', email='', password='';
const show=(text,bad=false)=>{status.textContent=text;status.className=`small mt-3 mb-0 ${bad?'text-danger':'text-muted'}`}; async function api(path,body){const r=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const d=await r.json();if(!r.ok)throw new Error(d.error||'Unable to continue.');return d;}
document.querySelector('#migration-form').addEventListener('submit',async event=>{event.preventDefault();try{email=document.querySelector('#email').value.trim();password=document.querySelector('#current-password').value;let idToken='';try{const existing=await signInWithEmailAndPassword(auth,email,password);await existing.user.reload();idToken=await existing.user.getIdToken(true)}catch(error){if(error.code!=='auth/user-not-found'&&error.code!=='auth/invalid-credential')throw error}const d=await api('{{ url_for("main.start_existing_email_migration") }}',{email,current_password:password,firebase_id_token:idToken});token=d.registration_token;if(d.verification_required){const c=await signInWithEmailAndPassword(auth,email,password);await sendEmailVerification(c.user);show('Firebase accepted the verification email request. Check Spam, Promotions, and All Mail.')}else show('This email is already verified. Continue to link it to this profile.');document.querySelector('#continue-panel').classList.remove('d-none')}catch(error){show(error.message,true)}});
document.querySelector('#continue').addEventListener('click',async()=>{try{const c=await signInWithEmailAndPassword(auth,email,password);await c.user.reload();if(!c.user.emailVerified)throw new Error('Please verify your email before continuing.');const d=await api('{{ url_for("main.complete_existing_email_migration") }}',{registration_token:token,firebase_id_token:await c.user.getIdToken(true)});show(d.message);location.assign(d.redirect)}catch(error){show(error.message,true)}});
</script>
{% endblock %}
