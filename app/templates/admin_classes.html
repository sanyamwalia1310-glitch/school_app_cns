{% extends "base.html" %}
{% block content %}
<div class="row g-4">
    <div class="col-lg-4">
        <div class="card p-3">
            <h1 class="h4 mb-3">Create Class</h1>
            <form method="post">
                <input class="form-control mb-3" name="name" placeholder="Class name" required>
                <input class="form-control mb-3" name="section" placeholder="Section" required>
                <select class="form-select mb-3" name="teacher_id">
                    <option value="">Assign Teacher</option>
                    {% for teacher in teachers %}
                    <option value="{{ teacher.id }}">{{ teacher.full_name }}</option>
                    {% endfor %}
                </select>
                <button class="btn btn-primary w-100">Add Class</button>
            </form>
        </div>
    </div>
    <div class="col-lg-8">
        <div class="card p-3">
            <h2 class="h5">Classes</h2>
            <table class="table">
                <thead><tr><th>Class</th><th>Section</th><th>Teacher</th></tr></thead>
                <tbody>
                {% for class_row in classes %}
                    <tr><td>{{ class_row.name }}</td><td>{{ class_row.section }}</td><td>{{ class_row.teacher_name or 'Unassigned' }}</td></tr>
                {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</div>
{% endblock %}
